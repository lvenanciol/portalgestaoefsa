<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Fundo sólido verde Extrafruti (sem cantos transparentes para iOS apple-touch-icon) -->
  <rect width="180" height="180" fill="#1B5E20" />
  
  <!-- Círculo branco central de respiro para a logomarca da Extrafruti -->
  <circle cx="90" cy="90" r="76.5" fill="#FFFFFF" />

  <g transform="translate(0, 0)">
    <!-- Folha verde da maçã -->
    <path
      d="M94.2,43.2 C92.5,39 95.6,35.1 99.8,34 C100.5,37.8 98.4,41.7 94.2,43.2 Z"
      fill="#2E7D32"
    />

    <!-- Arcos superiores da maçã (laranja Extrafruti #F37021) -->
    <path
      d="M48,81 C36,70 42,50 62,50 C75,50 85,60 90,68 C95,60 105,50 118,50 C138,50 144,70 132,81 L118,81 C124,73 121,62 110,62 C99,62 93,73 90,78 C87,73 81,62 70,62 C59,62 56,73 62,81 Z"
      fill="#F37021"
    />

    <!-- Tipografia centralizada extrafruti em verde institucional #2E7D32 -->
    <g fill="#2E7D32" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800;">
      <text
        x="90"
        y="110"
        font-size="22"
        text-anchor="middle"
        letter-spacing="-0.5"
      >extrafruti</text>
    </g>

    <!-- Bandeja / Sorriso inferior da maçã (laranja Extrafruti #F37021) -->
    <path
      d="M52,126 C63,143 75,148 90,148 C105,148 117,143 128,126 C120,131 106,135 90,135 C74,135 60,131 52,126 Z"
      fill="#F37021"
    />
  </g>
</svg>
