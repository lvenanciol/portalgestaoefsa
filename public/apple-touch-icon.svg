<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo sólido verde Extrafruti (sem cantos transparentes para iOS apple-touch-icon) -->
  <rect width="512" height="512" fill="#1B5E20" />
  
  <!-- Círculo sutil branco central para destacar o símbolo da Extrafruti -->
  <circle cx="256" cy="256" r="216" fill="#FFFFFF" />

  <!-- Símbolo Extrafruti: maçã laranja com folha verde, texto extrafruti e bandeja/sorriso inferior -->
  <g transform="translate(0, 0)">
    <!-- Folha verde superior -->
    <path
      d="M256,128 C242,94 268,64 300,56 C306,86 288,118 256,128 Z"
      fill="#43A047"
    />

    <!-- Arco superior da maçã (laranja Extrafruti #F37021) -->
    <path
      d="M136,220 C104,188 120,132 176,132 C214,132 242,160 256,182 C270,160 298,132 336,132 C392,132 408,188 376,220 L336,220 C352,198 344,166 314,166 C282,166 264,196 256,212 C248,196 230,166 198,166 C168,166 160,198 176,220 Z"
      fill="#F37021"
    />

    <!-- Bandeja / Sorriso inferior da maçã (laranja Extrafruti #F37021) -->
    <path
      d="M152,364 C180,404 216,420 256,420 C296,420 332,404 360,364 C336,378 298,390 256,390 C214,390 176,378 152,364 Z"
      fill="#F37021"
    />

    <!-- Tipografia centralizada extrafruti em verde vibrante #43A047 -->
    <g fill="#2E7D32" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800;">
      <!-- Texto vetorial renderizado com precisão -->
      <text
        x="256"
        y="306"
        font-size="64"
        text-anchor="middle"
        letter-spacing="-1.5"
      >extrafruti</text>
    </g>
  </g>
</svg>