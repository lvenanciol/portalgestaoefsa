<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo sólido verde Extrafruti (sem cantos transparentes para iOS apple-touch-icon) -->
  <rect width="512" height="512" fill="#1B5E20" />
  
  <!-- Círculo branco central de respiro para a logomarca da Extrafruti -->
  <circle cx="256" cy="256" r="217.6" fill="#FFFFFF" />

  <g transform="translate(0, 0)">
    <!-- Folha verde da maçã -->
    <path
      d="M268,122 C263,110 272,99 284,96 C286,107 280,118 268,122 Z"
      fill="#2E7D32"
    />

    <!-- Arcos superiores da maçã (laranja Extrafruti #F37021) -->
    <path
      d="M136,230 C102,198 119,142 176,142 C213,142 242,170 256,193 C270,170 299,142 336,142 C393,142 410,198 376,230 L336,230 C353,207 344,176 313,176 C282,176 265,207 256,222 C247,207 230,176 199,176 C168,176 159,207 176,230 Z"
      fill="#F37021"
    />

    <!-- Tipografia centralizada extrafruti em verde institucional #2E7D32 -->
    <g fill="#2E7D32" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800;">
      <text
        x="256"
        y="312"
        font-size="62.5"
        text-anchor="middle"
        letter-spacing="-1.5"
      >extrafruti</text>
    </g>

    <!-- Bandeja / Sorriso inferior da maçã (laranja Extrafruti #F37021) -->
    <path
      d="M148,358 C179,406 213,420 256,420 C299,420 333,406 364,358 C341,372 301,384 256,384 C211,384 171,372 148,358 Z"
      fill="#F37021"
    />
  </g>
</svg>
